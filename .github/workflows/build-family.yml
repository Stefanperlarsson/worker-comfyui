# Builds the four family images (moss, flux, chroma, h3) and pushes them to
# ghcr.io/stefanperlarsson/worker-comfyui:
#
#   :models-<family>        weights only, one layer per model file. Built once
#                           from the old network volume's S3 API; after that the
#                           job only checks every layer is there (seconds).
#   :code-<family>-<sha>    the Dockerfile with FAMILY=<family>, no weights.
#   :<family>-<sha>, :<family>
#                           code + models, assembled by tools/imgtool without
#                           pulling either — this is what the endpoints run.
#
# Why not just COPY the models in the Dockerfile: buildx holds each layer twice
# (snapshot + compressed blob), so the 42 GB h3 image needs ~90 GB of runner disk.
# imgtool streams one model file at a time instead (peak disk = the largest file).
name: build-family

on:
  workflow_dispatch:
    inputs:
      families:
        description: 'JSON list of families to build, e.g. ["qwen"]'
        default: '["moss", "flux", "chroma", "h3", "qwen"]'
  push:
    branches:
      - main
      - baked-families
    paths-ignore:
      - "**.md"

permissions:
  contents: read
  packages: write

env:
  REPO: ghcr.io/stefanperlarsson/worker-comfyui

jobs:
  models:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(inputs.families || '["moss", "flux", "chroma", "h3", "qwen"]') }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h / /mnt

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/imgtool/go.mod
          cache-dependency-path: tools/imgtool/go.sum

      - name: Build imgtool
        run: cd tools/imgtool && go build -o "$RUNNER_TEMP/imgtool" .

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install boto3
        run: pip install --quiet "boto3>=1.36"

      - name: Add missing model layers
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.VOLUME_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.VOLUME_S3_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.VOLUME_S3_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: ${{ secrets.VOLUME_S3_REGION }}
          BUCKET: ${{ secrets.VOLUME_S3_BUCKET }}
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/imgtool"
          ref="$REPO:models-${{ matrix.family }}"
          # Download to whichever disk has more room; the largest file is ~20 GB.
          if [ "$(df --output=avail -B1 /mnt | tail -1)" -gt "$(df --output=avail -B1 / | tail -1)" ]; then
            work=/mnt/models; else work="$RUNNER_TEMP/models"; fi
          sudo mkdir -p "$work" && sudo chown "$USER" "$work"
          # models.txt line: <path under models/> [<https url>]. With a url the file
          # comes from there (Hugging Face); without one, from the old volume's S3.
          while read -r model url; do
            [ -z "$model" ] && continue
            dest="/comfyui/models/$model"
            if "$tool" has -image "$ref" -dest "$dest"; then
              echo "have $model"; continue
            fi
            echo "::group::$model"
            local_file="$work/$(basename "$model")"
            if [ -n "${url:-}" ]; then
              curl -fL --retry 5 --retry-delay 10 -o "$local_file" "$url"
            elif [ -z "${BUCKET:-}" ]; then
              echo "::error::$model is missing from $ref and no volume S3 is configured to fetch it from"
              exit 1
            else
              python3 tools/s3get.py "$BUCKET" "runpod-slim/ComfyUI/models/$model" "$local_file"
            fi
            ls -la "$local_file"
            "$tool" add -image "$ref" -file "$local_file" -dest "$dest"
            rm -f "$local_file"
            echo "::endgroup::"
          done < "families/${{ matrix.family }}/models.txt"

  image:
    needs: models
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(inputs.families || '["moss", "flux", "chroma", "h3", "qwen"]') }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=$(echo ${GITHUB_SHA} | cut -c1-9)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # OCI media types + no provenance: imgtool appends OCI layers onto a plain
      # single-platform manifest, not an index.
      - name: Build code image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          build-args: FAMILY=${{ matrix.family }}
          provenance: false
          outputs: type=image,name=${{ env.REPO }}:code-${{ matrix.family }}-${{ steps.sha.outputs.short }},push=true,oci-mediatypes=true
          cache-from: type=gha,scope=${{ matrix.family }}
          cache-to: type=gha,mode=max,scope=${{ matrix.family }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/imgtool/go.mod
          cache-dependency-path: tools/imgtool/go.sum

      - name: Assemble code + models
        run: |
          set -euo pipefail
          cd tools/imgtool && go build -o "$RUNNER_TEMP/imgtool" . && cd -
          f=${{ matrix.family }}; s=${{ steps.sha.outputs.short }}
          outs="$REPO:$f-$s"
          # Only main moves the floating :<family> tag the endpoints may follow.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then outs="$outs,$REPO:$f"; fi
          "$RUNNER_TEMP/imgtool" assemble -base "$REPO:code-$f-$s" -models "$REPO:models-$f" -out "$outs"
          echo "### $f: \`$REPO:$f-$s\`" >> "$GITHUB_STEP_SUMMARY"
