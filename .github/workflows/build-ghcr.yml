# Builds the FULL worker image on GitHub Actions and pushes it to ghcr.io —
# the no-time-limit alternative to the RunPod Hub builder (30-minute cap, hit
# 2026-08-12). Public repo: free minutes, free GHCR storage, auth via the
# built-in GITHUB_TOKEN. No new secrets.
#
# The endpoint can consume this directly (image source:
#   ghcr.io/stefanperlarsson/worker-comfyui:sha-<shortsha>  or  :latest
# ) — or keep the Hub as the deploy path and treat this as the backup builder.
#
# --target final is LOAD-BEARING: `final` is the stage that installs the
# SageAttention wheel. An image built from `base` silently lacks it.
name: build-ghcr

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # The stock runner has ~14GB free on /; the image needs more. Same trick
      # release.yml used: drop the preinstalled toolchains we never touch.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Short SHA
        id: sha
        run: echo "short=$(echo ${GITHUB_SHA} | cut -c1-9)" >> "$GITHUB_OUTPUT"

      - name: Build and push (target final)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          push: true
          tags: |
            ghcr.io/stefanperlarsson/worker-comfyui:latest
            ghcr.io/stefanperlarsson/worker-comfyui:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha
